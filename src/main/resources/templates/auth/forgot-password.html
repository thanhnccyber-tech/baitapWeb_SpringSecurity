<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-box">
    <h2>Quên mật khẩu</h2>

    <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div th:if="${#fields.hasGlobalErrors()}" class="error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>
        <small class="error" th:errors="*{email}"></small>

        <button type="submit">Gửi OTP</button>
    </form>

    <p style="text-align:center; margin-top:15px;">
        <a th:href="@{/login}">Quay lại Login</a>
    </p>
</div>

</body>
</html>
