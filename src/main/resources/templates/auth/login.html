<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-box">
    <h2>Đăng nhập</h2>

    <div th:if="${param.error}" class="error">Username/email hoặc mật khẩu không đúng</div>
    <div th:if="${param.logout}" class="success">Bạn đã đăng xuất</div>
    <div th:if="${param.verified}" class="success">Xác thực thành công. Hãy đăng nhập.</div>
    <div th:if="${param.reset}" class="success">Đổi mật khẩu thành công.</div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label>Username hoặc Email</label>
        <input type="text" name="username" placeholder="Username hoặc email" required autofocus>

        <label>Mật khẩu</label>
        <input type="password" name="password" required>

        <button type="submit">Đăng nhập</button>
    </form>

    <p style="text-align:center; margin-top:15px;">
        <a th:href="@{/register}">Tạo tài khoản</a> ·
        <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
    </p>
</div>

</body>
</html>
