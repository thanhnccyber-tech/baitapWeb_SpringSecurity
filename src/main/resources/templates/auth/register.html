<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-box">
    <h2>Đăng ký</h2>

    <form th:action="@{/register}" th:object="${registerDTO}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div th:if="${#fields.hasGlobalErrors()}" class="error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <label>Username</label>
        <input th:field="*{username}">
        <small class="error" th:errors="*{username}"></small>

        <label>Email</label>
        <input type="email" th:field="*{email}">
        <small class="error" th:errors="*{email}"></small>

        <label>Họ tên</label>
        <input th:field="*{fullName}">
        <small class="error" th:errors="*{fullName}"></small>

        <label>Mật khẩu</label>
        <input type="password" th:field="*{password}">
        <small class="error" th:errors="*{password}"></small>

        <label>Xác nhận mật khẩu</label>
        <input type="password" th:field="*{confirmPassword}">
        <small class="error" th:errors="*{confirmPassword}"></small>

        <button type="submit">Đăng ký & nhận OTP</button>
    </form>

    <p style="text-align:center; margin-top:15px;">
        <a th:href="@{/login}">Đã có tài khoản?</a>
    </p>
</div>

</body>
</html>
