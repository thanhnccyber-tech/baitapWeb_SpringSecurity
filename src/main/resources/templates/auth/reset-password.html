<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-box">
    <h2>Đặt lại mật khẩu</h2>

    <div th:if="${success}" class="success" th:text="${success}"></div>

    <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div th:if="${#fields.hasGlobalErrors()}" class="error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>

        <label>OTP</label>
        <input name="otp" maxlength="6" required>

        <label>Mật khẩu mới</label>
        <input type="password" th:field="*{password}" required>
        <small class="error" th:errors="*{password}"></small>

        <label>Xác nhận mật khẩu</label>
        <input type="password" th:field="*{confirmPassword}" required>

        <button type="submit">Đổi mật khẩu</button>
    </form>

    <p style="text-align:center; margin-top:15px;">
        <a th:href="@{/login}">Quay lại Login</a>
    </p>
</div>

</body>
</html>
