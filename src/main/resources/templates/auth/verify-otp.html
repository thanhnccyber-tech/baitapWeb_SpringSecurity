<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận OTP</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-box">
    <h2>Xác nhận OTP</h2>

    <div th:if="${success}" class="success" th:text="${success}"></div>

    <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div th:if="${#fields.hasGlobalErrors()}" class="error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <label>Email</label>
        <input type="email" th:field="*{email}" readonly>

        <label>Mã OTP (6 số)</label>
        <input maxlength="6" inputmode="numeric" th:field="*{otp}" required>
        <small class="error" th:errors="*{otp}"></small>

        <button type="submit">Xác nhận</button>
    </form>

    <form th:action="@{/resend-register-otp}" method="post" style="margin-top:10px;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
        <button type="submit" style="background:#6b7280;">Gửi lại OTP</button>
    </form>

    <p style="text-align:center; margin-top:15px;">
        <a th:href="@{/login}">Quay lại Login</a>
    </p>
</div>

</body>
</html>
