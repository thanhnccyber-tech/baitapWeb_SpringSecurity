<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Trang chủ</title>
</head>
<body>

<main layout:fragment="content">
    <div class="main">
        <h1>Dashboard</h1>

        <div th:if="${success}" class="alert success" th:text="${success}"></div>

        <p sec:authorize="isAuthenticated()">
            Xin chào
            <strong th:text="${#authentication.principal.fullName}">User</strong>
        </p>
        <p sec:authorize="!isAuthenticated()">
            Bạn chưa đăng nhập. <a th:href="@{/login}">Đăng nhập ngay</a>
        </p>

        <div class="cards">
            <div class="card">
                <h3>Total Users</h3>
                <strong th:text="${userCount}">0</strong>
            </div>
            <div class="card">
                <h3>Total Products</h3>
                <strong th:text="${productCount}">0</strong>
            </div>
        </div>

        <div class="quick-links">
            <a class="button" th:href="@{/products}">Quản lý Products</a>
            <a class="button" sec:authorize="hasRole('ADMIN')" th:href="@{/users}">Quản lý Users</a>
        </div>
    </div>
</main>

</body>
</html>
