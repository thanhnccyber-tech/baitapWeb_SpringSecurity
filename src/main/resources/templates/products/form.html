<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${mode == 'create' ? 'Thêm Product' : 'Sửa Product'}">Product</title>
</head>
<body>

<main layout:fragment="content">
    <div class="main">
        <h1 th:text="${mode == 'create' ? 'Thêm Product' : 'Sửa Product'}"></h1>

        <form th:object="${productDTO}" method="post" enctype="multipart/form-data"
              th:action="${mode == 'create'} ? @{/products/create} : @{/products/edit/{id}(id=${productDTO.id})}">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div th:if="${#fields.hasGlobalErrors()}" class="error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>

            <label>Tên sản phẩm</label>
            <input th:field="*{name}">
            <small class="error" th:errors="*{name}"></small>

            <label>Mô tả</label>
            <textarea th:field="*{description}" rows="4"></textarea>

            <label>Giá</label>
            <input type="number" step="0.01" th:field="*{price}">
            <small class="error" th:errors="*{price}"></small>

            <label>Ảnh</label>
            <div th:if="${productDTO.imageUrl != null}" style="margin-bottom:10px;">
                <img th:src="${#strings.substringBefore(productDTO.imageUrl, '|')}"
                     style="width:180px; max-height:180px; object-fit:cover; border-radius:8px;">
            </div>
            <input type="file" name="image" accept="image/*">

            <button class="button" type="submit" style="margin-top:15px;">Lưu</button>
            <a class="button" style="background:#6b7280;" th:href="@{/products}">Hủy</a>
        </form>
    </div>
</main>

</body>
</html>
