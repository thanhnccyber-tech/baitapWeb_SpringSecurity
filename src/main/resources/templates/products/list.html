<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quản lý Products</title>
</head>
<body>

<main layout:fragment="content">
    <div class="main">
        <h1>Quản lý Products</h1>

        <div th:if="${success}" class="alert success" th:text="${success}"></div>

        <div class="toolbar">
            <form th:action="@{/products}" method="get" style="display:flex; gap:8px; flex:1;">
                <input name="keyword" th:value="${keyword}" placeholder="Tên sản phẩm, mô tả...">
                <input type="hidden" name="size" th:value="${size}">
                <button class="button" type="submit">Tìm kiếm</button>
            </form>
            <a class="button" th:href="@{/products/create}">+ Thêm Product</a>
        </div>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Ảnh</th>
                <th>Name</th>
                <th>Price</th>
                <th>User</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products.content}">
                <td th:text="${p.id}"></td>
                <td>
                    <img th:if="${p.imageUrl != null}"
                         th:src="${#strings.substringBefore(p.imageUrl, '|')}"
                         class="thumb" alt="img">
                    <span th:unless="${p.imageUrl != null}">No image</span>
                </td>
                <td th:text="${p.name}"></td>
                <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${p.username}"></td>
                <td class="actions">
                    <a th:href="@{/products/edit/{id}(id=${p.id})}">Edit</a>
                    <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" style="display:inline"
                          onsubmit="return confirm('Xóa product này?')">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="danger-link" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${products.empty}">
                <td colspan="6">Không có dữ liệu.</td>
            </tr>
            </tbody>
        </table>

        <div class="pagination">
            <a th:if="${products.hasPrevious()}"
               th:href="@{/products(page=${products.number-1}, size=${size}, keyword=${keyword})}">«</a>
            <span th:each="i : ${#numbers.sequence(0, products.totalPages > 0 ? products.totalPages - 1 : 0)}">
                <a th:classappend="${i == products.number ? 'active' : ''}"
                   th:href="@{/products(page=${i}, size=${size}, keyword=${keyword})}"
                   th:text="${i+1}"></a>
            </span>
            <a th:if="${products.hasNext()}"
               th:href="@{/products(page=${products.number+1}, size=${size}, keyword=${keyword})}">»</a>
        </div>
    </div>
</main>

</body>
</html>
