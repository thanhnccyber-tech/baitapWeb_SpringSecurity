<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${mode == 'create' ? 'Thêm User' : 'Sửa User'}">User</title>
</head>
<body>

<main layout:fragment="content">
    <div class="main">
        <form th:object="${userDTO}" method="post"
              th:action="${mode == 'create'} ? @{/users/create} : @{/users/edit/{id}(id=${userDTO.id})}">

            <h1 th:text="${mode == 'create' ? 'Thêm User' : 'Sửa User'}"></h1>

            <div th:if="${#fields.hasGlobalErrors()}" class="error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>

            <label>Username</label>
            <input th:field="*{username}">
            <small class="error" th:errors="*{username}"></small>

            <label>Email</label>
            <input type="email" th:field="*{email}">
            <small class="error" th:errors="*{email}"></small>

            <label>Họ tên</label>
            <input th:field="*{fullName}">
            <small class="error" th:errors="*{fullName}"></small>

            <label>Role</label>
            <select th:field="*{roleName}">
                <option value="ROLE_USER">USER</option>
                <option value="ROLE_ADMIN">ADMIN</option>
            </select>

            <label style="display:block; margin:10px 0;">
                <input type="checkbox" th:field="*{enabled}" style="width:auto;"> Enabled
            </label>

            <button class="button" type="submit">Lưu</button>
            <a class="button" style="background:#6b7280;" th:href="@{/users}">Hủy</a>
        </form>

        <p th:if="${mode == 'create'}" class="note" style="margin-top:15px;">
            Mật khẩu mặc định của user do Admin tạo: <b>123456</b>.
        </p>
    </div>
</main>

</body>
</html>
